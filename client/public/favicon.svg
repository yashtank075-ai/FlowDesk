<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <linearGradient id="fd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="fd-inner-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
  </defs>

  <!-- Rounded Base Container -->
  <rect width="32" height="32" rx="7.5" fill="url(#fd-grad)" />

  <!-- Geometric F + D Monogram -->
  <!-- Left Vertical Stem (F stem / D back) -->
  <rect x="6.5" y="6.5" width="4.5" height="19" rx="1.5" fill="url(#fd-inner-grad)" />

  <!-- D Outer Loop & F Top Bar -->
  <path
    d="M 10 6.5
       H 17.5
       C 22.5 6.5 25.5 10 25.5 16
       C 25.5 22 22.5 25.5 17.5 25.5
       H 10
       V 21
       H 17
       C 19.8 21 21.2 19 21.2 16
       C 21.2 13 19.8 11 17 11
       H 10
       Z"
    fill="url(#fd-inner-grad)"
  />

  <!-- F Middle Bar (Flow bar) -->
  <rect x="10" y="14" width="6.5" height="4" rx="1.2" fill="url(#fd-inner-grad)" />
</svg>
